<html lang="en">
<head>

  <style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial;
        background-color: #f2f2f2;
        position: absolute;
        top: 39%;
        left: 50%;
        transform: translate(-50%, -50%);
        text
    }

<body>

    <div class="box" id="output"></div>

  <script>
    var a = 100;
    var b = 20;
    sum = a+b;
    diff = a-b;
    prod = a*b;
    quot = a/b;


    document.getElementById("output").innerHTML =
    "<h2>Basic Calculator Dislpay</h2>" +
    "<h3>Addition: 100 + 20 =</h3>"+ sum + "<br>" +
    "<h3>Subtraction: 100 - 20 =</h3>" + diff + "<br>" +
    "<h3>Multiplication: 100 * 20 =</h3>" + prod + "<br>" +
    "<h3>Division: 100 / 20 =</h3>" + quot + "<br>" ;

  </script>
</body>
